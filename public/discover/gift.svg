<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6edd9"/>
      <stop offset="1" stop-color="#e9d9b8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <!-- soft forest backdrop -->
  <path d="M0 330 Q150 296 300 318 Q450 340 600 308 Q750 278 900 314 L900 600 L0 600 Z" fill="#647e1b"/>
  <path d="M0 440 Q225 420 450 432 Q675 444 900 424 L900 600 L0 600 Z" fill="#536917"/>
  <!-- shadow -->
  <ellipse cx="450" cy="502" rx="190" ry="24" fill="#3f5012"/>
  <!-- wrapped gift -->
  <g>
    <rect x="330" y="308" width="240" height="188" rx="8" fill="#2c5670"/>
    <rect x="310" y="262" width="280" height="52" rx="8" fill="#3d7391"/>
    <rect x="432" y="262" width="36" height="234" fill="#647e1b"/>
    <!-- bow made of two leaves and a knot -->
    <path d="M450 252 Q390 244 372 210 Q404 200 432 218 Q450 230 450 252 Z" fill="#647e1b"/>
    <path d="M450 252 Q510 244 528 210 Q496 200 468 218 Q450 230 450 252 Z" fill="#647e1b"/>
    <circle cx="450" cy="252" r="14" fill="#536917"/>
    <!-- leaf motif on the box face -->
    <g fill="#647e1b">
      <path d="M368 400 Q368 374 392 366 Q396 392 376 404 Z"/>
      <path d="M540 356 Q540 332 562 324 Q566 348 548 360 Z"/>
      <path d="M524 452 Q524 428 546 420 Q550 444 532 456 Z"/>
    </g>
  </g>
  <!-- flanking trees -->
  <g fill="#3f5012">
    <circle cx="110" cy="404" r="52"/>
    <rect x="102" y="440" width="16" height="70"/>
    <ellipse cx="792" cy="392" rx="62" ry="16"/>
    <polygon points="786,470 798,470 795,404 789,404"/>
  </g>
</svg>
